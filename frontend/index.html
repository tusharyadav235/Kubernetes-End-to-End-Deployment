<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmpTrack — Employee Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --green: #43e97b;
      --text: #e8e8f0;
      --muted: #8080a0;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BG grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%; transform: translateX(-50%);
      width: 800px; height: 500px;
      background: radial-gradient(ellipse, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    header {
      position: relative; z-index: 10;
      padding: 24px 40px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: rgba(10,10,15,0.7);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.5rem;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .badge {
      font-size: 0.7rem; font-weight: 600;
      background: rgba(108,99,255,0.15);
      color: var(--accent);
      border: 1px solid rgba(108,99,255,0.3);
      padding: 4px 10px; border-radius: 100px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    main {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto;
      padding: 40px 24px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem; font-weight: 700;
      margin-bottom: 6px;
    }
    h1 span { color: var(--accent); }

    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 36px; }

    /* Stats bar */
    .stats {
      display: flex; gap: 16px; margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px; flex: 1; min-width: 140px;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; }
    .stat-value.green { color: var(--green); }
    .stat-value.purple { color: var(--accent); }

    /* Layout */
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }

    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    /* Form card */
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      position: sticky; top: 24px;
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
    input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    select option { background: var(--surface); }

    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    button {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; font-weight: 500;
      padding: 10px 20px; border-radius: 8px;
      border: none; cursor: pointer;
      transition: all 0.2s; flex: 1;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #7c74ff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(108,99,255,0.4); }
    .btn-secondary {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--accent); }

    /* Toast */
    #toast {
      position: fixed; top: 24px; right: 24px; z-index: 999;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 20px;
      font-size: 0.88rem; max-width: 300px;
      opacity: 0; transform: translateY(-10px);
      transition: all 0.3s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error { border-color: var(--accent2); color: var(--accent2); }

    /* Table area */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .table-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; outline: none; width: 200px;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--muted); padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 20px; font-size: 0.88rem;
      border-bottom: 1px solid rgba(42,42,58,0.5);
      transition: background 0.15s;
    }
    tr:hover td { background: rgba(108,99,255,0.04); }
    tr:last-child td { border-bottom: none; }

    .dept-chip {
      display: inline-block;
      padding: 3px 10px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 500;
      background: rgba(108,99,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(108,99,255,0.2);
    }

    .salary { font-weight: 500; color: var(--green); font-family: 'Syne', sans-serif; font-size: 0.9rem; }

    .action-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 5px 12px;
      border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: all 0.2s; flex: none;
    }
    .action-btn.edit:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.del:hover { border-color: var(--accent2); color: var(--accent2); }

    .actions { display: flex; gap: 6px; }

    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 0.9rem;
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.4; }

    .loader {
      text-align: center; padding: 40px;
      color: var(--muted);
    }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">Emp<span>Track</span></div>
    <div class="badge">⚡ EKS Deployed</div>
  </header>

  <main>
    <h1>Employee <span>Manager</span></h1>
    <p class="subtitle">Full-stack CRUD · Spring Boot + MySQL · Kubernetes on Amazon EKS</p>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Employees</div>
        <div class="stat-value purple" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Salary</div>
        <div class="stat-value green" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Departments</div>
        <div class="stat-value" id="stat-depts">—</div>
      </div>
    </div>

    <div class="layout">
      <!-- FORM -->
      <div class="form-card">
        <div class="form-title"><div class="dot"></div><span id="form-title-text">Add Employee</span></div>
        <input type="hidden" id="emp-id"/>
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="f-name" placeholder="e.g. Arjun Sharma"/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="arjun@company.com"/>
        </div>
        <div class="field">
          <label>Department</label>
          <select id="f-dept">
            <option value="">Select department</option>
            <option>Engineering</option>
            <option>Product</option>
            <option>Design</option>
            <option>Marketing</option>
            <option>Finance</option>
            <option>HR</option>
            <option>Operations</option>
          </select>
        </div>
        <div class="field">
          <label>Salary (₹)</label>
          <input type="number" id="f-salary" placeholder="e.g. 850000"/>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="saveEmployee()">💾 Save</button>
          <button class="btn-secondary" onclick="resetForm()">✕ Clear</button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title">All Employees</div>
          <input class="search-box" type="text" placeholder="🔍 Search..." oninput="filterTable(this.value)"/>
        </div>
        <div id="table-container">
          <div class="loader"><div class="spinner"></div><br/>Loading employees...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const API = '/api/employees';
    let allEmployees = [];

    async function fetchEmployees() {
      try {
        const res = await fetch(API);
        allEmployees = await res.json();
        renderTable(allEmployees);
        updateStats(allEmployees);
      } catch (e) {
        document.getElementById('table-container').innerHTML =
          `<div class="empty"><div class="icon">⚠️</div>Cannot reach API server.<br/>Make sure backend is running.</div>`;
      }
    }

    function updateStats(data) {
      document.getElementById('stat-total').textContent = data.length;
      const avg = data.length ? Math.round(data.reduce((s,e) => s + e.salary, 0) / data.length) : 0;
      document.getElementById('stat-avg').textContent = avg ? '₹' + avg.toLocaleString('en-IN') : '—';
      const depts = new Set(data.map(e => e.department).filter(Boolean));
      document.getElementById('stat-depts').textContent = depts.size || '—';
    }

    function renderTable(data) {
      if (!data.length) {
        document.getElementById('table-container').innerHTML =
          `<div class="empty"><div class="icon">👥</div>No employees yet.<br/>Add your first one!</div>`;
        return;
      }
      const rows = data.map(e => `
        <tr class="fade-in">
          <td><strong>${e.name}</strong></td>
          <td style="color:var(--muted)">${e.email}</td>
          <td><span class="dept-chip">${e.department || '—'}</span></td>
          <td><span class="salary">₹${Number(e.salary).toLocaleString('en-IN')}</span></td>
          <td><div class="actions">
            <button class="action-btn edit" onclick="editEmployee(${e.id})">✏ Edit</button>
            <button class="action-btn del" onclick="deleteEmployee(${e.id})">✕ Del</button>
          </div></td>
        </tr>`).join('');
      document.getElementById('table-container').innerHTML = `
        <table>
          <thead><tr>
            <th>Name</th><th>Email</th><th>Dept</th><th>Salary</th><th>Actions</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function filterTable(q) {
      const filtered = allEmployees.filter(e =>
        e.name.toLowerCase().includes(q.toLowerCase()) ||
        e.email.toLowerCase().includes(q.toLowerCase()) ||
        (e.department || '').toLowerCase().includes(q.toLowerCase())
      );
      renderTable(filtered);
    }

    async function saveEmployee() {
      const id = document.getElementById('emp-id').value;
      const body = {
        name: document.getElementById('f-name').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        department: document.getElementById('f-dept').value,
        salary: parseFloat(document.getElementById('f-salary').value)
      };
      if (!body.name || !body.email || !body.salary) { showToast('Please fill all required fields', 'error'); return; }
      try {
        const url = id ? `${API}/${id}` : API;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (!res.ok) throw new Error();
        showToast(id ? '✓ Employee updated!' : '✓ Employee added!', 'success');
        resetForm(); fetchEmployees();
      } catch { showToast('Failed to save employee', 'error'); }
    }

    function editEmployee(id) {
      const emp = allEmployees.find(e => e.id === id);
      if (!emp) return;
      document.getElementById('emp-id').value = emp.id;
      document.getElementById('f-name').value = emp.name;
      document.getElementById('f-email').value = emp.email;
      document.getElementById('f-dept').value = emp.department || '';
      document.getElementById('f-salary').value = emp.salary;
      document.getElementById('form-title-text').textContent = 'Edit Employee';
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function deleteEmployee(id) {
      if (!confirm('Delete this employee?')) return;
      try {
        await fetch(`${API}/${id}`, {method: 'DELETE'});
        showToast('Employee deleted', 'success');
        fetchEmployees();
      } catch { showToast('Delete failed', 'error'); }
    }

    function resetForm() {
      ['emp-id','f-name','f-email','f-salary'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-dept').value = '';
      document.getElementById('form-title-text').textContent = 'Add Employee';
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show ${type}`;
      setTimeout(() => t.className = '', 3000);
    }

    fetchEmployees();
  </script>
</body>
</html>
